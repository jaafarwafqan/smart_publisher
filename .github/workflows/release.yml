name: Release Pipeline

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Release channel
        required: true
        default: closed-beta
        type: choice
        options:
          - closed-beta

jobs:
  pre-release-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"

      - name: Release source hardening
        run: dart scripts/ci/check_release_hardening.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce formatting
        run: dart format --set-exit-if-changed lib test scripts/ci

      - name: Analyze
        run: flutter analyze

      - name: Android release configuration
        run: flutter test test/release/android_release_configuration_test.dart

      - name: Tests
        run: flutter test

  build:
    needs: pre-release-quality-gate
    runs-on: ubuntu-latest
    env:
      # The keystore is materialized only inside the ephemeral runner.  The
      # Gradle task fails closed if any signing input is absent.
      ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/smart_publisher_release.jks
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      SP_API_BASE_URL: ${{ vars.SP_API_BASE_URL }}
      SP_AUTH_BASE_URL: ${{ vars.SP_AUTH_BASE_URL }}
      SP_OAUTH_BASE_URL: ${{ vars.SP_OAUTH_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"

      - name: Install dependencies
        run: flutter pub get

      - name: Materialize Android release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_STORE_FILE"
          test -s "$ANDROID_RELEASE_STORE_FILE"

      - name: Build Android AppBundle
        run: |
          test -n "$SP_API_BASE_URL"
          test -n "$SP_AUTH_BASE_URL"
          test -n "$SP_OAUTH_BASE_URL"
          case "$SP_API_BASE_URL" in https://*) ;; *) exit 1 ;; esac
          case "$SP_AUTH_BASE_URL" in https://*) ;; *) exit 1 ;; esac
          case "$SP_OAUTH_BASE_URL" in https://*) ;; *) exit 1 ;; esac
          flutter build appbundle --release \
            --dart-define=SP_API_BASE_URL="$SP_API_BASE_URL" \
            --dart-define=SP_AUTH_BASE_URL="$SP_AUTH_BASE_URL" \
            --dart-define=SP_OAUTH_BASE_URL="$SP_OAUTH_BASE_URL"

      - name: Generate release manifest
        run: |
          cat <<EOF > release-manifest.json
          {
            "release_channel": "${{ inputs.release_channel }}",
            "git_sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}"
          }
          EOF

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-publisher-release-${{ inputs.release_channel }}
          path: |
            build/app/outputs/bundle/release/*.aab
            release-manifest.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: smart-publisher-release-${{ inputs.release_channel }}
          path: release-artifacts

      - name: Deploy release
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
        run: |
          chmod +x scripts/release/deploy_release.sh
          ./scripts/release/deploy_release.sh
