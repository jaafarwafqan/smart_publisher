name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Hard gate, no continue-on-error — a real secret leak must fail the
        # build outright (P0-4 from the CTO audit: Sanctum tokens were
        # previously committed under docs/audit/evidence/).

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"

      - name: Release source hardening
        run: dart scripts/ci/check_release_hardening.dart

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce formatting
        run: dart format --set-exit-if-changed lib test scripts/ci

      - name: Static analysis
        run: flutter analyze

      - name: Android release configuration
        run: flutter test test/release/android_release_configuration_test.dart

      - name: All tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Enforce coverage floor
        # External report #3 (2026-08-15) flagged that lcov.info was
        # uploaded with no enforced minimum. Measured overall line coverage
        # at the time this gate was added was 56.65% (13,664 lines,
        # coverage/lcov.info); 50% is that measurement minus a safety
        # margin, not the target. Ratchet plan: raise this toward the 80%
        # overall target once CI has run it a few times, and add a second,
        # stricter pass (--min-pct 80) scoped to lib/src/**/domain/repositories,
        # lib/src/backend_contracts, lib/src/core/router (route guards), and
        # lib/src/features/composer specifically once per-path filtering is
        # worth the added script complexity.
        run: >-
          awk -F: '/^DA:/{split($2,a,","); total++; if(a[2]+0>0) hit++}
          END{pct=(total>0)?(hit/total)*100:0;
          printf "Flutter line coverage: %d/%d = %.2f%% (floor: 50%%)\n", hit, total, pct;
          if (pct < 50) { print "::error::Coverage " pct "% is below the 50% floor"; exit 1 }}'
          coverage/lcov.info

      - name: Unit and integration tests (sanity rerun)
        run: flutter test
