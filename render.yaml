# Reference/proposed Render Blueprint for this repo's static web build.
# NOT auto-applied by anything — the live staging static site was created
# directly in the Render dashboard (no existing render.yaml to reconcile
# with), so this file only takes effect if you explicitly link it as a
# Blueprint on Render, and doing so may need its `name`/build settings
# reconciled with whatever the existing service is actually called first.
#
# If you'd rather not adopt Blueprint-managed deploys right now, the
# `headers` list below can instead be pasted in one at a time under the
# existing static site's Settings -> Headers tab in the Render dashboard —
# same effect, zero config-file risk.
#
# Why this file exists: web/index.html's <meta> CSP (2026-08-12 audit fix)
# can't set X-Frame-Options or the CSP `frame-ancestors` directive — browsers
# ignore both when delivered via <meta> rather than a real HTTP response
# header. This is the durable fix for that gap; mirrors the header set
# smart_publisher_backend's SecurityHeadersMiddleware already sends on every
# API response, so the two surfaces are consistent.
services:
  - type: web
    runtime: static
    name: smart-publisher-web-staging
    buildCommand: >-
      flutter build web --release
      --dart-define=SP_API_BASE_URL=https://smart-publisher-api-staging.onrender.com/api/v1
      --dart-define=SP_AUTH_BASE_URL=https://smart-publisher-api-staging.onrender.com/api/v1
      --dart-define=SP_OAUTH_BASE_URL=https://smart-publisher-api-staging.onrender.com
    staticPublishPath: build/web
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()"
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; base-uri 'self'; form-action 'self';
          object-src 'none'; frame-ancestors 'none';
          script-src 'self' 'wasm-unsafe-eval' blob:;
          style-src 'self' 'unsafe-inline'; font-src 'self' data:;
          img-src 'self' data: blob: https:;
          connect-src 'self' https://smart-publisher-api-staging.onrender.com
