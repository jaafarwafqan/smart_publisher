org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# flutter_facebook_auth (added 2026-08-12 for native mobile sign-in) ships
# an Android module whose Kotlin compile task picks a newer default JVM
# target than its own Java compile task, which Gradle refuses to link
# ("Inconsistent JVM Target Compatibility") by default. This is Kotlin
# Gradle Plugin's own documented escape hatch for exactly this class of
# third-party-plugin mismatch — downgrades the check from a hard build
# failure to a warning; it does not change what either task actually
# compiles to, and a root-project build.gradle.kts hack to force the
# plugin's own AGP compileOptions was tried first and rejected by AGP
# itself ("sourceCompatibility has been finalized") once the plugin's own
# build script had already configured it.
kotlin.jvm.target.validation.mode=warning
