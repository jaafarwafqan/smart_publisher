<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="الناشر الذكي — إدارة النشر والجدولة عبر منصات التواصل الاجتماعي من مكان واحد.">

  <!--
    2026-08-12 audit finding: the deployed web build sent HSTS and
    X-Content-Type-Options (edge/CDN defaults) but no CSP or
    Referrer-Policy at all. Meta http-equiv tags are the only CSP
    mechanism a static HTML file can set on its own — but the spec
    explicitly ignores `frame-ancestors` (and `sandbox`/report
    directives) when delivered this way, so clickjacking protection
    (X-Frame-Options / frame-ancestors) still needs a real HTTP header
    from the hosting layer — see render.yaml at the repo root for that.
    connect-src includes both the local dev backend and the deployed
    staging API so this same file works for `flutter run -d chrome` and
    the built web app without per-environment templating.

    2026-08-16 incident: the CSP above was too strict for Flutter Web's
    own CanvasKit renderer, which fetches its WASM bundle from
    https://www.gstatic.com/flutter-canvaskit/... and Roboto from
    https://fonts.gstatic.com/... by default — neither host was
    allow-listed, so both were blocked outright and the app never
    finished booting (a real blank white page reproduced live, not a
    hypothetical). Added the two required Google-hosted origins to
    script-src/font-src/connect-src — this is Flutter's own documented
    exception list for a strict-CSP CanvasKit deployment, not a general
    loosening.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'self';
    form-action 'self';
    object-src 'none';
    script-src 'self' 'wasm-unsafe-eval' blob: https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';
    font-src 'self' data: https://fonts.gstatic.com;
    img-src 'self' data: blob: https:;
    connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com http://127.0.0.1:8000 http://localhost:8000 https://smart-publisher-api-staging.onrender.com;
  ">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="الناشر الذكي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>الناشر الذكي</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
