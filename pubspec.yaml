name: smart_publisher
description: "Advanced Institutional News & Media Publishing Platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0

  # State Management & Code Generation Core
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.3
  
  # Routing & Navigation
  go_router: ^14.0.0

  # Networking & Advanced API Clients
  dio: ^5.4.0
  json_annotation: ^4.8.1
  flutter_secure_storage: ^9.2.2
  file_picker: ^11.0.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

  # Charts & Data Visualization
  fl_chart: ^0.69.0
  emoji_picker_flutter: ^4.5.3

  # Native social sign-in (Android/iOS only — web/desktop keep the existing
  # browser-based OAuth flow in dashboard_screen.dart unchanged).
  flutter_facebook_auth: ^7.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Reactive Code Generators & Data Serialization
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - docs/legal/privacy_policy.md
    - docs/legal/terms_of_service.md
    - docs/legal/support.md
