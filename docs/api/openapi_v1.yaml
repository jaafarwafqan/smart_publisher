openapi: 3.0.3
info:
  title: Smart Publisher API
  version: "1.0.0"
  description: >
    Laravel 13 backend for Smart Publisher (social-media publishing platform).
    Updated 2026-08-16 (Phase 2 doc-consistency pass) to drop the `/accounts/*`
    route group entirely — those routes are not merely broken, they were
    deliberately REMOVED from `routes/api.php` (Sprint 2, API Hardening, per
    that route file's own comment) — this repo's own hard constraint is:
    never resurrect `AccountController`, use `SocialAccountController` at
    `/users/{user}/social-accounts/*` instead — and to add the real routes
    that existed in code but not here yet: Organizations, platform Admin, and
    the new inbound Webhooks receiver. This same pass also found that the
    backend's own separately-maintained served spec
    (`smart_publisher_backend/resources/openapi/openapi.json`, returned by
    `GET /openapi.json`) already had all of this correct — the drift was
    specific to this file, a second, independently-hand-maintained copy that
    fell behind. That same check surfaced a larger, NOT-yet-closed gap this
    pass did not attempt to fully replicate here: the served spec also
    documents an entire Auth/Sprint-4 surface this file still omits —
    self-registration, password reset, email verification, 2FA, the bare
    `/login`/`/refresh` aliases, and `/account/data-export`. Treat the
    backend's served `/openapi.json` as the more current source for those
    specific routes until this file catches up; see
    `docs/audit/KNOWN_ISSUES.md` for the open item recommending this file
    either stop being independently hand-maintained or gain a CI check that
    fails on drift between the two, so this exact gap can't quietly reopen.
    Originally updated 2026-07-30 to reflect the real, current
    route table and real controller/validation/Resource behavior. Every
    response is wrapped by `ApiEnvelopeMiddleware` in the
    shape `{success, message, data, meta, errors}` with **no exceptions** for
    any `/api/*` route, including error responses (the Webhooks routes are
    the one deliberate exception — they're provider callbacks, not part of
    this envelope contract). The production public contract is a closed
    beta: only Telegram and Facebook Pages (and, since 2026-08, a linked
    Instagram Business Account discovered through Facebook) are accepted as
    social providers. Other identifiers may exist in non-production test
    fixtures, but are not production integrations and are rejected there.
servers:
  - url: http://127.0.0.1:8000/api/v1
    description: Local development (php artisan serve)
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Privacy
  - name: Branches
  - name: Users
  - name: SocialAccounts
  - name: Posts
  - name: Media
  - name: Analytics
  - name: Notifications
  - name: Calendar
  - name: Settings
  - name: SystemSettings
  - name: Publishing
  - name: Organizations
  - name: Admin
  - name: Webhooks

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token.
  schemas:
    ApiEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { nullable: true }
        meta: { type: object }
        errors: { nullable: true, description: "Validation errors keyed by field, or an error code array, or null" }
      required: [success, message, data, meta, errors]

    Post:
      type: object
      description: Real shape returned by PostResource (backend_contracts/v1 posts.md, verified against PostResource.php 2026-07-27).
      properties:
        id: { type: integer }
        title: { type: string }
        content: { type: string, nullable: true }
        status: { type: string, enum: [draft, scheduled, publishing, published, failed] }
        meta:
          type: object
          properties:
            platform_content:
              type: object
              additionalProperties: { type: string }
              description: "Per-provider caption override; {} when empty (normalized server-side so it never serializes as a JSON array)."
        publish_batch_key: { type: string, nullable: true }
        platforms:
          type: array
          items: { type: string }
          description: "Real providers this post targets, derived from its selected social_pages. Empty array if the relation wasn't eager-loaded by the endpoint."
        user:
          type: object
          nullable: true
          properties: { id: { type: integer }, name: { type: string }, email: { type: string } }
        branch:
          type: object
          nullable: true
          properties: { id: { type: integer }, name: { type: string }, code: { type: string } }
        media_attachments: { type: array, items: { $ref: '#/components/schemas/MediaAttachment' } }
        scheduled_at: { type: string, format: date-time, nullable: true, description: "Also stamped for immediate publish-now as an internal queue-processing detail — not necessarily real user-scheduled intent." }
        published_at: { type: string, format: date-time, nullable: true }
        failed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MediaAttachment:
      type: object
      properties:
        id: { type: integer }
        post_id: { type: integer, nullable: true }
        type: { type: string, enum: [image, video, document] }
        collection: { type: string }
        path: { type: string }
        thumbnail_path: { type: string, nullable: true }
        mime_type: { type: string, nullable: true }
        size: { type: integer }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        duration_seconds: { type: integer, nullable: true }
        tags: { type: array, items: { type: string } }
        content_hash: { type: string, nullable: true }
        duplicate_of_id: { type: integer, nullable: true, description: "Present only in the store() response — informational hint, never blocks the upload." }

    SocialAccount:
      type: object
      description: Real shape from SocialAccountController::transform().
      properties:
        id: { type: integer }
        user_id: { type: integer }
        provider: { type: string, enum: [facebook, telegram], description: "Production closed-beta provider only" }
        discovery_mode: { type: string, enum: [auto, manual], description: "auto for Facebook Pages; manual for Telegram channels" }
        provider_account_id: { type: string }
        account_name: { type: string, nullable: true }
        account_username: { type: string, nullable: true }
        token_expires_at: { type: string, format: date-time, nullable: true }
        is_token_expired: { type: boolean }
        has_refresh_token: { type: boolean }
        scopes: { type: array, items: { type: string } }
        metadata: { type: object }
        is_active: { type: boolean }
        status: { type: string, enum: [connected, expired, revoked, failed, pending] }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_published_at: { type: string, format: date-time, nullable: true }

    SocialPage:
      type: object
      description: Real shape from SocialAccountController::transformPage().
      properties:
        id: { type: integer }
        social_account_id: { type: integer }
        page_id: { type: string }
        kind: { type: string, description: "Facebook page or Telegram channel" }
        name: { type: string, nullable: true }
        username: { type: string, nullable: true }
        picture_url: { type: string, nullable: true }
        can_publish: { type: boolean }
        is_selected: { type: boolean }
        status: { type: string, enum: [valid, needs_reauth] }
        discovery_source: { type: string, enum: [auto, manual] }
        metadata: { type: object }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_verified_at: { type: string, format: date-time, nullable: true }

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string }, password: { type: string } }
      responses:
        '200': { description: "Access + refresh token issued", content: { application/json: { schema: { $ref: '#/components/schemas/ApiEnvelope' } } } }
      x-rate-limit: throttle:auth-login
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties: { refresh_token: { type: string } }
      responses:
        '200': { description: "Rotated access + refresh token pair" }
      x-rate-limit: throttle:auth-refresh
  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      responses: { '200': { description: OK } }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout — deletes both the access and refresh token rows for this device
      responses: { '200': { description: OK } }

  /account/data-deletion-requests:
    post:
      tags: [Privacy]
      summary: Record an authenticated self-service data deletion request
      description: >
        This route is authenticated but not tenant-gated, so an account that
        no longer has an active organization can still request deletion. It
        records a pending request instead of immediately destroying data.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean, description: "Must be true." }
                reason: { type: string, maxLength: 1000, nullable: true }
      responses:
        '202': { description: "{ id, status: pending, requested_at }" }
        '422': { description: "confirm was omitted or not accepted" }

  /branches:
    get:
      tags: [Branches]
      summary: List branches
      security: [{ bearerAuth: [] }]
      x-permission: branches.view
      responses: { '200': { description: OK } }
    post:
      tags: [Branches]
      summary: Create branch
      x-permission: branches.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties: { name: { type: string, maxLength: 255 }, code: { type: string, maxLength: 50, description: "unique" }, is_active: { type: boolean } }
      responses: { '201': { description: Created } }
  /branches/{branch}:
    get: { tags: [Branches], summary: "Get branch", x-permission: branches.view, parameters: [{name: branch, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
    put:
      tags: [Branches]
      summary: Update branch
      x-permission: branches.update
      parameters: [{name: branch, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string }, code: { type: string }, is_active: { type: boolean } }
      responses: { '200': { description: OK } }
    delete: { tags: [Branches], summary: "Delete branch", x-permission: branches.delete, parameters: [{name: branch, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }

  /users:
    get: { tags: [Users], summary: "List users (with branch, roles, social accounts eager-loaded)", x-permission: users.view, responses: { '200': {description: OK} } }
    post:
      tags: [Users]
      summary: Create user
      x-permission: users.create
      description: "Assigning `roles` additionally requires the `roles.assign` permission (403 if attempted without it) — closes the privilege-escalation gap found in Round 1 of the CTO audit."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 255 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                branch_id: { type: integer, nullable: true }
                roles: { type: array, items: { type: string }, description: "each must exist as a real role name; requires roles.assign" }
      responses: { '201': { description: Created } }
  /users/{user}:
    get: { tags: [Users], summary: "Get user (+ roles, permissions, social accounts)", x-permission: users.view, parameters: [{name: user, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
    put:
      tags: [Users]
      summary: "Update user (name/email/password/branch only — roles are NOT settable here, use /users/{user}/roles)"
      x-permission: users.update
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string }, email: { type: string }, password: { type: string, minLength: 8 }, branch_id: { type: integer, nullable: true } }
      responses: { '200': { description: OK } }
    delete: { tags: [Users], summary: "Delete user (also revokes all Sanctum tokens)", x-permission: users.delete, parameters: [{name: user, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /users/{user}/roles:
    post:
      tags: [Users]
      summary: Sync a user's roles (replaces the full set)
      x-permission: roles.assign
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [roles], properties: { roles: { type: array, minItems: 1, items: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /users/{user}/permissions:
    get: { tags: [Users], summary: "Get a user's effective roles + all permissions", x-permission: permissions.view, parameters: [{name: user, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
    post:
      tags: [Users]
      summary: Sync direct (non-role) permissions on a user
      x-permission: roles.assign
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [permissions], properties: { permissions: { type: array, items: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /users/{user}/tokens:
    get: { tags: [Users], summary: "List a user's Sanctum tokens (id/name/abilities/last_used_at/created_at/expires_at only, never the token value)", x-permission: tokens.view, parameters: [{name: user, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
    post:
      tags: [Users]
      summary: "Mint a new token for a user"
      x-permission: tokens.revoke
      description: "`abilities` is REQUIRED with no default — a tokens.revoke holder must explicitly opt into minting a full-access ('*') token for another user rather than getting one silently by omitting the field."
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [name, abilities], properties: { name: { type: string }, abilities: { type: array, minItems: 1, items: { type: string } } } } } }
      responses: { '201': { description: "Created — plaintext token returned exactly once" } }
  /users/{user}/tokens/{tokenId}:
    delete: { tags: [Users], summary: "Revoke a token", x-permission: tokens.revoke, parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: tokenId, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK}, '404': {description: "Token not found"} } }
  /catalog/roles-permissions:
    get: { tags: [Users], summary: "Full catalog of every role and permission in the system", x-permission: roles.view, responses: { '200': {description: OK} } }
  /catalog/social-providers:
    get: { tags: [SocialAccounts], summary: "List of production closed-beta provider identifiers", x-organization-permission: social_accounts.view, responses: { '200': { description: "Production: { providers: [facebook, telegram] }. Non-production may expose internal test identifiers, which must not be treated as live integrations." } } }

  /users/{user}/social-accounts:
    get:
      tags: [SocialAccounts]
      summary: "List a user's connected social accounts"
      x-permission: social-accounts.view
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SocialAccount' } }
      description: >
        No POST here (Sprint C, role/permission remediation): a generic
        manual-link endpoint that accepted an arbitrary access_token for any
        provider with no verification was removed. Every real connection now
        goes through authorize()/callback() (web/desktop OAuth),
        native-connect (Android/iOS), or telegram/connect (bot token) below —
        all three actually verify the account with the provider before
        saving.
  /users/{user}/social-accounts/native-connect:
    post:
      tags: [SocialAccounts]
      summary: "Android/iOS only: verify a client-asserted Facebook access token (from flutter_facebook_auth) and link it"
      description: >
        Unlike authorize()/callback(), the client hands back a real access
        token directly instead of a ?code= to exchange — this endpoint
        independently re-verifies it server-side via Meta's /debug_token
        (confirms it's currently valid AND was minted for this exact app)
        before trusting it. Only `provider: facebook` is accepted today.
      x-permission: social-accounts.create
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [provider, access_token], properties: { provider: { type: string, enum: [facebook] }, access_token: { type: string } } } } }
      responses:
        '200': { description: "Linked/relinked", content: { application/json: { schema: { $ref: '#/components/schemas/SocialAccount' } } } }
        '422': { description: "Token invalid, expired, or issued for a different app; code: native_token_invalid" }
  /users/{user}/social-accounts/authorize:
    post:
      tags: [SocialAccounts]
      summary: "Begin OAuth authorization — generates a state token and authorize_url"
      x-permission: social-accounts.oauth.authorize
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [provider, redirect_uri], properties: { provider: { type: string, enum: [facebook, telegram] }, redirect_uri: { type: string, format: uri }, scopes: { type: array, items: { type: string } } } } } }
      responses: { '200': { description: "{ provider, state, state_expires_at, authorize_url }" } }
  /users/{user}/social-accounts/callback:
    post:
      tags: [SocialAccounts]
      summary: "Complete OAuth — exchanges code for tokens, validates state (must be unexpired and match a pending record)"
      x-permission: social-accounts.oauth.callback
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [provider, code, state], properties: { provider: { type: string, enum: [facebook, telegram] }, code: { type: string }, state: { type: string }, scopes: { type: array, items: { type: string } } } } } }
      responses:
        '200': { description: "Connected", content: { application/json: { schema: { $ref: '#/components/schemas/SocialAccount' } } } }
        '422': { description: "Invalid or expired OAuth state" }
  /users/{user}/social-accounts/telegram/connect:
    post:
      tags: [SocialAccounts]
      summary: "Connect a Telegram bot by token (Telegram has no OAuth redirect flow — it verifies the bot token directly via Bot API getMe)"
      x-permission: social-accounts.create
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [bot_token], properties: { bot_token: { type: string } } } } }
      responses:
        '201': { description: Created }
        '422': { description: "Bot token verification failed" }
  /users/{user}/social-accounts/{socialAccount}:
    get: { tags: [SocialAccounts], summary: "Get one social account (Policy: view)", x-permission: social-accounts.view, parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: socialAccount, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
    put:
      tags: [SocialAccounts]
      summary: "Update a social account (Policy: update)"
      x-permission: social-accounts.update
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: socialAccount, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { account_name: { type: string }, account_username: { type: string }, access_token: { type: string }, refresh_token: { type: string }, token_expires_at: { type: string, format: date-time }, scopes: { type: array, items: { type: string } }, metadata: { type: object }, status: { type: string }, is_active: { type: boolean } } } } }
      responses: { '200': { description: OK } }
    delete: { tags: [SocialAccounts], summary: "Delete a social account (Policy: delete)", x-permission: social-accounts.delete, parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: socialAccount, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /users/{user}/social-accounts/{socialAccount}/refresh-token:
    post: { tags: [SocialAccounts], summary: "Dispatch RefreshSocialAccountTokenJob (Policy: refreshToken); 422 if the account has no refresh token", x-permission: social-accounts.refresh-token, parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: socialAccount, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: "Job dispatched, status set to pending"}, '422': {description: "No refresh token available"} } }
  /users/{user}/social-accounts/{socialAccount}/test:
    post:
      tags: [SocialAccounts]
      summary: "Test connection health via the real provider SDK's checkAccountHealth()"
      description: >
        Returns {available, healthy, message}. `available: false` means the
        provider integration can't verify at all (never conflated with
        `healthy: false`, which means a confirmed-broken connection). A
        confirmed-healthy check self-heals a stale expired/failed status back
        to connected; a confirmed-unhealthy one marks it expired.
      x-permission: social-accounts.test-connection
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: socialAccount, in: path, required: true, schema: {type: integer}}]
      responses: { '200': { description: OK }, '422': { description: "No access token stored" } }
  /users/{user}/social-accounts/{socialAccount}/status:
    post:
      tags: [SocialAccounts]
      summary: "Manually set status/is_active (Policy: changeStatus)"
      x-permission: social-accounts.change-status
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: socialAccount, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [connected, expired, revoked, failed, pending] }, is_active: { type: boolean } } } } }
      responses: { '200': { description: OK } }
  /users/{user}/social-accounts/{socialAccount}/pages:
    get:
      tags: [SocialAccounts]
      summary: "List pages/channels under this account (Policy: viewPages)"
      x-permission: social-accounts.pages.view
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: socialAccount, in: path, required: true, schema: {type: integer}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SocialPage' } }
  /users/{user}/social-accounts/{socialAccount}/pages/sync:
    post: { tags: [SocialAccounts], summary: "Re-sync pages — auto-discovery providers call SocialPageSyncService::syncAuto(), manual ones (e.g. Telegram) call syncManual() to re-verify already-added channels", x-permission: social-accounts.pages.sync, parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: socialAccount, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /users/{user}/social-accounts/{socialAccount}/pages/add:
    post:
      tags: [SocialAccounts]
      summary: "Manually add/verify a channel by identifier — only implemented for Telegram today (verifyChat via Bot API); throws for any other provider"
      x-permission: social-accounts.pages.manage
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: socialAccount, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [identifier], properties: { identifier: { type: string, description: "e.g. a Telegram channel @username or chat id" } } } } }
      responses: { '201': { description: Created }, '422': { description: "Not supported for this provider / verification failed" } }
  /users/{user}/social-accounts/{socialAccount}/pages/{socialPage}:
    delete: { tags: [SocialAccounts], summary: "Remove a page", x-permission: social-accounts.pages.manage, parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: socialAccount, in: path, required: true, schema: {type: integer}}, {name: socialPage, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK}, '404': {description: "Page does not belong to this account"} } }
  /users/{user}/social-accounts/{socialAccount}/pages/select:
    post:
      tags: [SocialAccounts]
      summary: "Set which pages are 'selected' (available as publish targets) — replaces the full selection"
      x-permission: social-accounts.pages.manage
      parameters: [{name: user, in: path, required: true, schema: {type: integer}}, {name: socialAccount, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [page_ids], properties: { page_ids: { type: array, items: { type: integer } } } } } }
      responses: { '200': { description: OK } }

  /posts:
    get:
      tags: [Posts]
      summary: "List posts (paginated, 20/page), optional ?status= filter"
      x-permission: posts.view
      parameters: [{name: status, in: query, required: false, schema: {type: string, enum: [draft, scheduled, publishing, published, failed]}}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Post' } }
                  meta:
                    type: object
                    properties: { current_page: {type: integer}, last_page: {type: integer}, per_page: {type: integer}, total: {type: integer} }
    post:
      tags: [Posts]
      summary: "Create a post (always starts as draft)"
      x-permission: posts.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 255 }
                content: { type: string, nullable: true }
                branch_id: { type: integer, nullable: true }
                meta: { type: object, description: "free-form; platform_content lives here" }
                target_page_ids: { type: array, items: { type: integer }, description: "social_pages.id values — synced into post_targets" }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } } }
  /posts/{post}:
    get: { tags: [Posts], summary: "Get post (+ publicationAttempts, socialPages)", parameters: [{name: post, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
    put:
      tags: [Posts]
      summary: "Update post (Policy: update)"
      parameters: [{name: post, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { title: { type: string }, content: { type: string, nullable: true }, branch_id: { type: integer, nullable: true }, meta: { type: object }, target_page_ids: { type: array, items: { type: integer } } }
      responses: { '200': { description: OK } }
    delete: { tags: [Posts], summary: "Delete post (Policy: delete)", parameters: [{name: post, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /posts/{post}/schedule:
    post:
      tags: [Posts]
      summary: "Schedule a post for future publish — dedicated endpoint, not routed through the generic update()"
      description: "Validates scheduled_at is a real future date. Sets status=scheduled, generates a fresh publish_batch_key, clears failed_at/last_error."
      parameters: [{name: post, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [scheduled_at], properties: { scheduled_at: { type: string, format: date-time, description: "must be after:now" } } } } }
      responses: { '200': { description: OK }, '422': { description: "scheduled_at missing or not in the future" } }
  /posts/{post}/publish-now:
    post:
      tags: [Posts]
      summary: "Publish immediately to the given (or the post's own stored) target pages"
      description: "Only dispatches to pages with can_publish=true and status=valid. Sets status=scheduled with scheduled_at=now() as an internal detail so the same PublishPostJob path is reused — the UI must never present this as 'the user scheduled it'."
      parameters: [{name: post, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { social_page_ids: { type: array, items: { type: integer }, description: "omit to use the post's own already-targeted pages" } } } } }
      responses: { '200': { description: "Jobs dispatched, { jobs_count }" }, '422': { description: "No usable pages selected" } }
  /posts/{post}/draft:
    post: { tags: [Posts], summary: "Revert a post to draft — clears scheduled_at/published_at/failed_at/last_error/publish_batch_key", parameters: [{name: post, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /posts/{post}/cancel:
    post: { tags: [Posts], summary: "Cancel a scheduled post before it publishes", parameters: [{name: post, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /posts/{post}/approve:
    post:
      tags: [Posts]
      summary: "Approve a post pending approval (Sprint F, role/permission remediation) — requires posts.approve"
      description: >
        Dispatches the post's own already-selected targets for publishing.
        The approver, not the original author, is who PublishPostJob
        re-verifies still holds a valid publishing capability at execution
        time — see PublishPostJob's own docblock.
      x-permission: posts.approve
      parameters: [{name: post, in: path, required: true, schema: {type: integer}}]
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }, '422': { description: "Post is not pending approval" } }
  /posts/{post}/reject:
    post:
      tags: [Posts]
      summary: "Reject a post pending approval, with an optional note"
      x-permission: posts.approve
      parameters: [{name: post, in: path, required: true, schema: {type: integer}}]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 1000 } } } } }
      responses: { '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } } }

  /media:
    get:
      tags: [Media]
      summary: "List the current user's media library (paginated, 30/page)"
      x-permission: media.view
      parameters:
        - {name: collection, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string, enum: [image, video, document]}}
        - {name: search, in: query, schema: {type: string}, description: "matches meta.original_name"}
        - {name: tags, in: query, schema: {type: array, items: {type: string}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/MediaAttachment' } }
    post:
      tags: [Media]
      summary: "Upload media (multipart)"
      x-permission: media.upload
      description: "Type-aware size limit: 20MB image / 500MB video / 50MB document. content_hash (sha256) computed for duplicate detection — an identical re-upload still succeeds, duplicate_of_id is only an informational hint."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                collection: { type: string, maxLength: 100 }
                post_id: { type: integer, nullable: true }
                tags: { type: array, items: { type: string, maxLength: 50 } }
      responses: { '201': { description: Created } }
  /media/{mediaAttachment}/compress:
    post:
      tags: [Media]
      summary: "Compress an image in place (scaleDown to max 1920x1920, quality 75)"
      x-permission: media.upload
      description: "Images only — video needs a queued transcode job, not yet implemented (422 if attempted on a video)."
      parameters: [{name: mediaAttachment, in: path, required: true, schema: {type: integer}}]
      responses: { '200': { description: OK }, '422': { description: "Not an image, or compression failed" } }
  /posts/{post}/media/attach:
    post:
      tags: [Media]
      summary: "Attach existing media library items to a post"
      x-permission: media.upload
      parameters: [{name: post, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [attachment_ids], properties: { attachment_ids: { type: array, minItems: 1, items: { type: integer } } } } } }
      responses: { '200': { description: OK } }
  /posts/{post}/media/{mediaAttachment}:
    delete: { tags: [Media], summary: "Detach media from a post (does not delete the file — Policy: delete)", parameters: [{name: post, in: path, required: true, schema: {type: integer}}, {name: mediaAttachment, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK}, '422': {description: "Attachment does not belong to this post"} } }
  /media/{mediaAttachment}:
    delete: { tags: [Media], summary: "Permanently delete media (file + thumbnail + record — Policy: delete)", parameters: [{name: mediaAttachment, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }

  /analytics:
    get:
      tags: [Analytics]
      summary: "Post-count summary (cached via DashboardCacheService)"
      x-permission: publishing.monitor
      responses: { '200': { description: "{ total_posts, published, failed, scheduled, draft, engagement: {score, trend}, updated_at }" } }
  /analytics/dashboard:
    get:
      tags: [Analytics]
      summary: "Real per-page metrics rollup — top posts, totals, best platform/hour"
      description: "best_platform/best_publish_hour are null (never a guessed value) below a minimum sample size of 3 real data points — an honest 'not enough data yet' rather than false-confidence noise."
      x-permission: publishing.monitor
      responses: { '200': { description: "{ top_posts, total_reach, total_engagement, total_impressions, average_engagement_rate, best_platform, best_publish_hour }" } }
  /analytics/posts:
    get:
      tags: [Analytics]
      summary: "Bulk per-post metrics for a given id list"
      x-permission: publishing.monitor
      parameters: [{name: "post_ids[]", in: query, required: true, schema: {type: array, items: {type: integer}}}]
      responses: { '200': { description: OK } }
  /analytics/posts/{post}:
    get: { tags: [Analytics], summary: "Metrics for a single post, summed across all its target pages", x-permission: publishing.monitor, parameters: [{name: post, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }

  /notifications:
    get:
      tags: [Notifications]
      summary: "List persistent recipient-scoped notifications"
      x-permission: notifications.view
      description: "Items are tenant- and recipient-scoped; a failure to load must not be rendered by clients as an empty inbox."
      responses: { '200': { description: "{ unread, items: [{ id, type, title, body, is_read, read, created_at }] }" } }
  /notifications/mark-all-read:
    post: { tags: [Notifications], summary: "Persistently mark the authenticated recipient's notifications as read", x-permission: notifications.view, responses: { '200': {description: OK} } }
  /notifications/{notification}:
    patch: { tags: [Notifications], summary: "Persistently mark one recipient-owned notification as read", x-permission: notifications.view, parameters: [{name: notification, in: path, required: true, schema: {type: string}}], responses: { '200': {description: OK} } }

  /calendar:
    get:
      tags: [Calendar]
      summary: "Upcoming scheduled posts (status=scheduled only), max 50, cached"
      x-permission: posts.view
      description: "Fixed 2026-07-27 to filter by status=scheduled rather than 'has a scheduled_at value', which previously also matched already-published posts (publish-now stamps scheduled_at=now() as an internal detail)."
      responses: { '200': { description: "{ items: [{id, post_id, title, status, scheduled_at, branch}] }" } }

  /settings:
    get: { tags: [Settings], summary: "Per-user app settings (locale/timezone/date+time format/feature flags), cached", x-permission: settings.view, responses: { '200': {description: OK} } }

  /system-settings/oauth-providers:
    get: { tags: [SystemSettings], summary: "Per-provider OAuth app configuration state for every supported provider", x-permission: system-settings.view, responses: { '200': {description: OK} } }
  /system-settings/oauth-providers/{provider}:
    put:
      tags: [SystemSettings]
      summary: "Update a provider's OAuth app config"
      description: "A blank/omitted client_secret NEVER overwrites an already-stored one (the read side never echoes the real secret back, so blank means 'keep existing', not 'clear'). The audit log records which FIELDS changed, never the values."
      x-permission: system-settings.manage
      parameters: [{name: provider, in: path, required: true, schema: {type: string}}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { client_id: { type: string, maxLength: 255 }, client_secret: { type: string, maxLength: 1000 }, authorize_url: { type: string, format: uri }, token_url: { type: string, format: uri }, default_scopes: { type: array, items: { type: string } }, is_enabled: { type: boolean } }
      responses: { '200': { description: OK }, '422': { description: "Unsupported provider" } }
  /system-settings/oauth-providers/{provider}/test:
    post: { tags: [SystemSettings], summary: "Live-test the provider's OAuth connection", x-permission: system-settings.manage, parameters: [{name: provider, in: path, required: true, schema: {type: string}}], responses: { '200': {description: "{ success, message, tested_at }"} } }
  /system-settings/oauth-providers/{provider}/audit-log:
    get: { tags: [SystemSettings], summary: "Last 20 audit entries for a provider's settings changes (fields changed, never values)", x-permission: system-settings.view, parameters: [{name: provider, in: path, required: true, schema: {type: string}}], responses: { '200': {description: OK} } }

  /publishing/tick:
    post: { tags: [Publishing], summary: "Manually dispatch ProcessScheduledPostsJob (normally runs every minute via the scheduler)", x-permission: publishing.manage, responses: { '200': {description: OK} } }
  /publishing/dead-letters:
    get: { tags: [Publishing], summary: "Paginated dead-letter job records (terminal failures across any job type)", x-permission: publishing.monitor, responses: { '200': {description: OK} } }
  /publishing/dead-letters/{deadLetterJob}/retry:
    post: { tags: [Publishing], summary: "Requeue a dead-lettered job for another attempt", x-permission: publishing.manage, parameters: [{name: deadLetterJob, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK}, '404': {description: "Not found"} } }
  /publishing/circuit-breaker/clear:
    post:
      tags: [Publishing]
      summary: "Clear a provider's circuit-breaker failure count"
      x-permission: publishing.manage
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [provider], properties: { provider: { type: string, maxLength: 50 } } } } }
      responses: { '200': { description: OK } }

  /organizations:
    get: { tags: [Organizations], summary: "List every organization the authenticated user holds a membership in", responses: { '200': {description: OK} } }
  /organizations/{organization}/switch:
    post: { tags: [Organizations], summary: "Switch the caller's active organization (must hold a membership in it)", parameters: [{name: organization, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: "New current_organization_id"}, '403': {description: "Not a member of this organization"} } }
  /organizations/{organization}/audit-logs:
    get: { tags: [Organizations], summary: "Organization-scoped audit trail — explicit {organization} binding, not ambient tenant context", x-organization-permission: audit_logs.view, parameters: [{name: organization, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /organizations/current:
    get: { tags: [Organizations], summary: "The caller's currently active organization", responses: { '200': {description: OK} } }
    put:
      tags: [Organizations]
      summary: "Update the current organization's own settings"
      x-organization-permission: settings.manage
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string }, timezone: { type: string } } } } } }
      responses: { '200': { description: OK } }
  /organization/members:
    get: { tags: [Organizations], summary: "List the current organization's members", x-organization-permission: members.view, responses: { '200': {description: OK} } }
    post:
      tags: [Organizations]
      summary: "Add a member to the current organization"
      x-organization-permission: members.manage
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [user_id, role], properties: { user_id: { type: integer }, role: { type: string } } } } } }
      responses: { '201': { description: Created } }
  /organization/members/{user}:
    put: { tags: [Organizations], summary: "Change a member's role", x-organization-permission: members.manage, parameters: [{name: user, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
    delete: { tags: [Organizations], summary: "Remove a member from the current organization", x-organization-permission: members.manage, parameters: [{name: user, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }

  /admin/dashboard:
    get: { tags: [Admin], summary: "Platform-wide operational summary", security: [{ bearerAuth: [] }], x-super-admin: true, responses: { '200': {description: OK} } }
  /admin/organizations:
    get: { tags: [Admin], summary: "List every organization on the platform (cross-tenant)", x-super-admin: true, responses: { '200': {description: OK} } }
    post: { tags: [Admin], summary: "Create an organization", x-super-admin: true, x-rate-limit: "throttle:platform-admin-write", responses: { '201': {description: Created} } }
  /admin/organizations/{organization}:
    get: { tags: [Admin], summary: "Get one organization (cross-tenant)", x-super-admin: true, parameters: [{name: organization, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
    put: { tags: [Admin], summary: "Update an organization", x-super-admin: true, x-rate-limit: "throttle:platform-admin-write", parameters: [{name: organization, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /admin/organizations/{organization}/status:
    post: { tags: [Admin], summary: "Activate/suspend an organization", x-super-admin: true, x-rate-limit: "throttle:platform-admin-write", parameters: [{name: organization, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /admin/organizations/{organization}/reconcile-primary-owner:
    post: { tags: [Admin], summary: "Repair a missing/ambiguous primary_owner_id invariant on an organization", x-super-admin: true, x-rate-limit: "throttle:platform-admin-write", parameters: [{name: organization, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /admin/users:
    get: { tags: [Admin], summary: "List every user on the platform (cross-tenant)", x-super-admin: true, responses: { '200': {description: OK} } }
    post: { tags: [Admin], summary: "Create a platform user", x-super-admin: true, x-rate-limit: "throttle:platform-admin-write", responses: { '201': {description: Created} } }
  /admin/users/{user}:
    get: { tags: [Admin], summary: "Get one user (cross-tenant)", x-super-admin: true, parameters: [{name: user, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
    put: { tags: [Admin], summary: "Update a user", x-super-admin: true, x-rate-limit: "throttle:platform-admin-write", parameters: [{name: user, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /admin/users/{user}/memberships:
    put: { tags: [Admin], summary: "Replace a user's organization memberships wholesale", x-super-admin: true, x-rate-limit: "throttle:platform-admin-write", parameters: [{name: user, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /admin/users/{user}/platform-role:
    post: { tags: [Admin], summary: "Grant/revoke platform super_admin", x-super-admin: true, x-rate-limit: "throttle:platform-admin-write", parameters: [{name: user, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /admin/users/{user}/status:
    post: { tags: [Admin], summary: "Suspend/reactivate a user's platform access", x-super-admin: true, x-rate-limit: "throttle:platform-admin-write", parameters: [{name: user, in: path, required: true, schema: {type: integer}}], responses: { '200': {description: OK} } }
  /admin/oauth-providers:
    get: { tags: [Admin], summary: "Platform-wide shared OAuth App ID/Secret per provider (super_admin only — see Sprint D, role/permission remediation, for why this moved off the tenant-scoped SystemSettings permission)", x-super-admin: true, responses: { '200': {description: OK} } }
  /admin/oauth-providers/{provider}:
    put: { tags: [Admin], summary: "Update a provider's shared app credentials", x-super-admin: true, x-rate-limit: "throttle:platform-admin-write", parameters: [{name: provider, in: path, required: true, schema: {type: string}}], responses: { '200': {description: OK} } }
  /admin/oauth-providers/{provider}/test:
    post: { tags: [Admin], summary: "Live-test a provider's shared app credentials", x-super-admin: true, x-rate-limit: "throttle:platform-admin-write", parameters: [{name: provider, in: path, required: true, schema: {type: string}}], responses: { '200': {description: OK} } }
  /admin/oauth-providers/{provider}/audit-log:
    get: { tags: [Admin], summary: "Audit trail for a provider's shared credential changes", x-super-admin: true, parameters: [{name: provider, in: path, required: true, schema: {type: string}}], responses: { '200': {description: OK} } }
  /admin/audit-logs:
    get: { tags: [Admin], summary: "Platform-wide audit trail across every organization (see /organizations/{organization}/audit-logs for the org-scoped equivalent, gated by audit_logs.view instead of super_admin)", x-super-admin: true, responses: { '200': {description: OK} } }

  /webhooks/facebook:
    get:
      tags: [Webhooks]
      summary: "Meta's one-time Page-webhook subscription handshake"
      description: "Not part of the ApiEnvelope contract — a bare text/plain echo of ?hub.challenge= when ?hub.verify_token= matches FACEBOOK_WEBHOOK_VERIFY_TOKEN, else 403. See docs/api/webhooks.md."
      security: []
      parameters: [{name: "hub.mode", in: query, required: true, schema: {type: string, enum: [subscribe]}}, {name: "hub.verify_token", in: query, required: true, schema: {type: string}}, {name: "hub.challenge", in: query, required: true, schema: {type: string}}]
      responses: { '200': { description: "text/plain hub.challenge echo" }, '403': { description: "Verify token mismatch or not configured" } }
    post:
      tags: [Webhooks]
      summary: "Facebook Page webhook event delivery (feed changes — reactions/comments/shares)"
      description: "Requires a valid X-Hub-Signature-256 (HMAC-SHA256 of the raw body, keyed by the existing OAuth App Secret) or 401. Idempotent — a redelivered event is a no-op. Not part of the ApiEnvelope contract."
      security: []
      responses: { '200': { description: "{ ok: true }" }, '401': { description: "Missing/invalid signature" } }
  /webhooks/telegram/{socialAccountId}:
    post:
      tags: [Webhooks]
      summary: "Per-bot Telegram update delivery (channel posts, bot membership changes)"
      description: "Requires a valid X-Telegram-Bot-Api-Secret-Token matching this specific bot's own secret (registered automatically via setWebhook at connect time) or 401; unknown account is 404. Idempotent. Not part of the ApiEnvelope contract."
      security: []
      parameters: [{name: socialAccountId, in: path, required: true, schema: {type: integer}}]
      responses: { '200': { description: "{ ok: true }" }, '401': { description: "Missing/invalid secret token" }, '404': { description: "Unknown webhook endpoint" } }
